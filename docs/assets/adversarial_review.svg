<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">修复者不能给自己打分</title>
  <desc id="desc">修复方只写候选，审查方只读挑错，双方互不信任，最终由 strict gate 决定是否交付。</desc>
  <defs>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#f3c96b"/>
    </marker>
    <style>
      .figure-title { fill: #f7f9ff; font-size: 48px; font-weight: 760; letter-spacing: -1px; }
      .figure-subtitle { fill: #a9b4ca; font-size: 19px; font-weight: 450; }
      .side-title { fill: #f7f9ff; font-size: 30px; font-weight: 720; }
      .side-subtitle { fill: #a9b4ca; font-size: 18px; font-weight: 500; }
      .center-title { fill: #f7f9ff; font-size: 25px; font-weight: 720; }
      .gate-title { fill: #f3c96b; font-size: 28px; font-weight: 740; }
      .gate-subtitle { fill: #f7f9ff; font-size: 16px; font-weight: 560; }
    </style>
  </defs>

  <rect width="1280" height="560" fill="#0b1020"/>

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="64" y="70" class="figure-title">修复者不能给自己打分</text>
    <text x="64" y="108" class="figure-subtitle">修复方只写候选，审查方只读挑错，交付由终审门禁决定。</text>

    <path d="M264 355V397H620V420" fill="none" stroke="#f3c96b" stroke-opacity=".7" stroke-width="2.5" marker-end="url(#arrow-gold)"/>
    <path d="M1016 355V397H660V420" fill="none" stroke="#f3c96b" stroke-opacity=".7" stroke-width="2.5" marker-end="url(#arrow-gold)"/>

    <g>
      <rect x="64" y="185" width="400" height="170" rx="22" fill="#6f9dff" fill-opacity=".08" stroke="#6f9dff" stroke-opacity=".72" stroke-width="2"/>
      <text x="264" y="257" class="side-title" text-anchor="middle">修复方 · 只写候选</text>
      <text x="264" y="299" class="side-subtitle" text-anchor="middle">可写 PDF，不得自评</text>
    </g>

    <g>
      <path d="M640 170V390" fill="none" stroke="#f3c96b" stroke-opacity=".32" stroke-width="2"/>
      <rect x="536" y="220" width="208" height="100" rx="20" fill="#f3c96b" fill-opacity=".08" stroke="#f3c96b" stroke-width="2"/>
      <text x="640" y="280" class="center-title" text-anchor="middle">互不信任</text>
    </g>

    <g>
      <rect x="816" y="185" width="400" height="170" rx="22" fill="#6f9dff" fill-opacity=".08" stroke="#6f9dff" stroke-opacity=".72" stroke-width="2"/>
      <text x="1016" y="257" class="side-title" text-anchor="middle">审查方 · 只读挑错</text>
      <text x="1016" y="299" class="side-subtitle" text-anchor="middle">只返回缺陷清单</text>
    </g>

    <g>
      <rect x="440" y="430" width="400" height="94" rx="22" fill="#f3c96b" fill-opacity=".1" stroke="#f3c96b" stroke-width="2"/>
      <text x="640" y="472" class="gate-title" text-anchor="middle">STRICT GATE</text>
      <text x="640" y="502" class="gate-subtitle" text-anchor="middle">终审通过才交付</text>
    </g>
  </g>
</svg>
