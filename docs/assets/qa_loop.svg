<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">SuperTranslate QA 循环：只接受严格变好的候选</title>
  <desc id="desc">QA 检测器产生结构化缺陷清单，确定性规划器执行有界修复，候选分数严格下降则接受并复检，否则恢复修复前快照并停止。</desc>
  <defs>
    <radialGradient id="background" cx=".5" cy=".48" r=".72">
      <stop offset="0" stop-color="#111b33"/>
      <stop offset=".62" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#080c18"/>
    </radialGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162948"/>
      <stop offset="1" stop-color="#101a31"/>
    </linearGradient>
    <linearGradient id="goldCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#302719"/>
      <stop offset="1" stop-color="#171a2a"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-30%" width="150%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#02050d" flood-opacity=".56"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#78a9ff"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#f1c75b"/>
    </marker>
    <style>
      .eyebrow { fill: #78a9ff; font-size: 12px; font-weight: 760; letter-spacing: 2.3px; }
      .title { fill: #f5f7ff; font-size: 35px; font-weight: 790; letter-spacing: -.7px; }
      .subtitle { fill: #9baaca; font-size: 16px; }
      .node-title { fill: #f5f7ff; font-size: 21px; font-weight: 780; }
      .node-en { fill: #78a9ff; font-size: 10px; font-weight: 780; letter-spacing: 1.3px; }
      .node-sub { fill: #b1bdd6; font-size: 15px; }
      .micro { fill: #7f90b3; font-size: 11px; font-weight: 650; }
      .route { fill: #9aa9c9; font-size: 12px; font-weight: 700; }
      .center-title { fill: #f5f7ff; font-size: 30px; font-weight: 850; letter-spacing: -.4px; }
      .center-sub { fill: #f1c75b; font-size: 12px; font-weight: 780; letter-spacing: 1.1px; }
      .decision { fill: #f5f7ff; font-size: 20px; font-weight: 790; }
      .decision-sub { fill: #d6c589; font-size: 14px; }
      .badge { fill: #0b1020; font-size: 12px; font-weight: 850; }
    </style>
  </defs>

  <rect width="1100" height="760" fill="#0b1020"/>
  <rect width="1100" height="760" fill="url(#background)"/>
  <circle cx="550" cy="410" r="222" fill="none" stroke="#78a9ff" stroke-opacity=".07" stroke-width="56"/>
  <circle cx="550" cy="410" r="184" fill="none" stroke="#78a9ff" stroke-opacity=".12" stroke-width="1.2" stroke-dasharray="4 10"/>
  <circle cx="550" cy="410" r="132" fill="#78a9ff" opacity=".06" filter="url(#glow)"/>

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="50" y="46" class="eyebrow">ITERATIVE QA · SNAPSHOT · STRICT IMPROVEMENT</text>
    <text x="50" y="88" class="title">质量不是“修过”，而是“证明确实更好”</text>
    <text x="50" y="117" class="subtitle">每轮重跑同一组检测器；候选没有严格降低问题分，就恢复快照并停止。</text>

    <g transform="translate(830 40)">
      <rect width="220" height="44" rx="22" fill="#111b32" stroke="#f1c75b" stroke-opacity=".58"/>
      <circle cx="23" cy="22" r="7" fill="#f1c75b"/>
      <text x="42" y="27" class="node-sub">默认 4 轮 · API 1–8</text>
    </g>

    <path d="M310 287C346 230 378 207 420 207" fill="none" stroke="#78a9ff" stroke-width="2.4" marker-end="url(#arrow)"/>
    <text x="365" y="240" class="route" text-anchor="middle">DETECT</text>
    <path d="M680 207C738 207 774 235 800 279" fill="none" stroke="#78a9ff" stroke-width="2.4" marker-end="url(#arrow)"/>
    <text x="742" y="235" class="route" text-anchor="middle">PLAN</text>
    <path d="M925 395C946 439 929 481 893 510" fill="none" stroke="#f1c75b" stroke-width="2.5" marker-end="url(#arrowGold)"/>
    <text x="956" y="455" class="route" text-anchor="middle">RERUN</text>

    <g filter="url(#shadow)">
      <rect x="50" y="238" width="260" height="178" rx="22" fill="url(#blueCard)" stroke="#78a9ff" stroke-opacity=".67" stroke-width="1.5"/>
      <rect x="420" y="150" width="260" height="115" rx="20" fill="url(#blueCard)" stroke="#78a9ff" stroke-opacity=".58" stroke-width="1.4"/>
      <rect x="800" y="235" width="250" height="160" rx="22" fill="url(#goldCard)" stroke="#f1c75b" stroke-opacity=".68" stroke-width="1.5"/>
    </g>

    <text x="75" y="271" class="node-title">QA 检测器</text>
    <text x="75" y="292" class="node-en">ALL DETECTORS RERUN</text>
    <text x="75" y="321" class="node-sub">漏翻 · 保护区改动</text>
    <text x="75" y="345" class="node-sub">重叠 / 空页 · 图片丢失</text>
    <text x="75" y="369" class="node-sub">公式 / 矢量完整性</text>
    <text x="75" y="393" class="node-sub">视觉回归 · 字号 / 表格 / 引用</text>

    <text x="550" y="187" class="node-title" text-anchor="middle">结构化缺陷清单</text>
    <text x="550" y="210" class="node-en" text-anchor="middle">TRANSLATIONISSUE[]</text>
    <text x="550" y="237" class="node-sub" text-anchor="middle">code · page · severity · fingerprint</text>

    <text x="925" y="272" class="node-title" text-anchor="middle">有界修复</text>
    <text x="925" y="294" class="node-en" text-anchor="middle">REGISTERED ACTIONS ONLY</text>
    <line x1="827" y1="312" x2="1023" y2="312" stroke="#f1c75b" stroke-opacity=".18"/>
    <text x="925" y="339" class="node-sub" text-anchor="middle">重叠 → 保守版面修复</text>
    <text x="925" y="365" class="node-sub" text-anchor="middle">漏翻 → 外层有界重译</text>

    <circle cx="550" cy="410" r="116" fill="#0e172b" stroke="#f1c75b" stroke-opacity=".72" stroke-width="1.8" filter="url(#shadow)"/>
    <circle cx="550" cy="410" r="96" fill="none" stroke="#78a9ff" stroke-opacity=".22"/>
    <text x="550" y="392" class="center-title" text-anchor="middle">只接受</text>
    <text x="550" y="429" class="center-title" text-anchor="middle">严格变好</text>
    <text x="550" y="458" class="center-sub" text-anchor="middle">(ERRORS, ISSUES) MUST DECREASE</text>

    <path d="M765 510L905 462L1045 540L905 618L765 570Z" fill="#171b2b" stroke="#f1c75b" stroke-opacity=".78" stroke-width="1.7" filter="url(#shadow)"/>
    <text x="905" y="525" class="decision" text-anchor="middle">候选分数比较</text>
    <text x="905" y="551" class="decision-sub" text-anchor="middle">(error 数, issue 总数)</text>
    <text x="905" y="578" class="node-en" text-anchor="middle">CANDIDATE &lt; PREVIOUS ?</text>

    <path d="M765 548C726 564 697 596 675 635" fill="none" stroke="#78a9ff" stroke-width="2.6" marker-end="url(#arrow)"/>
    <text x="720" y="586" class="route" text-anchor="middle">严格更好</text>
    <g filter="url(#shadow)">
      <rect x="400" y="625" width="275" height="78" rx="20" fill="#11233d" stroke="#78a9ff" stroke-opacity=".78" stroke-width="1.6"/>
    </g>
    <circle cx="431" cy="664" r="14" fill="#78a9ff"/>
    <path d="M424 664l5 5 10-12" fill="none" stroke="#0b1020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="455" y="657" class="node-title">接受候选</text>
    <text x="455" y="681" class="node-en">ACCEPT · NEXT INSPECTION</text>

    <path d="M400 665C272 713 137 666 153 416" fill="none" stroke="#78a9ff" stroke-width="2.6" marker-end="url(#arrow)"/>
    <text x="258" y="692" class="route" text-anchor="middle">回到同一组检测器（仅迭代模式）</text>

    <path d="M796 598C674 735 410 738 330 615" fill="none" stroke="#f1c75b" stroke-width="2.4" stroke-dasharray="7 7" marker-end="url(#arrowGold)"/>
    <text x="570" y="733" class="route" text-anchor="middle">持平或变差</text>
    <g filter="url(#shadow)">
      <rect x="50" y="535" width="280" height="95" rx="20" fill="url(#goldCard)" stroke="#f1c75b" stroke-opacity=".76" stroke-width="1.6"/>
    </g>
    <circle cx="82" cy="574" r="14" fill="#f1c75b"/>
    <path d="M75 567l14 14M89 567l-14 14" stroke="#0b1020" stroke-width="2.6" stroke-linecap="round"/>
    <text x="108" y="570" class="node-title">回滚修复前快照</text>
    <text x="108" y="594" class="node-sub">恢复 mono / dual PDF · 停止无进展循环</text>
    <text x="108" y="614" class="node-en">ROLLBACK · STOP</text>
  </g>
</svg>
