<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" role="img" aria-labelledby="title desc">
  <title id="title">SuperTranslate QA 循环：只接受严格变好</title>
  <desc id="desc">检测、缺陷清单和有界修复依次执行；候选分数严格变好则接受并复检，否则回滚修复前快照。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#6f9dff"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#f3c96b"/>
    </marker>
    <style>
      .figure-title { fill: #f7f9ff; font-size: 46px; font-weight: 760; letter-spacing: -1px; }
      .figure-subtitle { fill: #a9b4ca; font-size: 19px; font-weight: 450; }
      .corner-note { fill: #f3c96b; font-size: 16px; font-weight: 650; }
      .node-title { fill: #f7f9ff; font-size: 26px; font-weight: 720; }
      .node-subtitle { fill: #a9b4ca; font-size: 16px; font-weight: 500; }
      .branch-label { fill: #a9b4ca; font-size: 15px; font-weight: 620; }
      .gold-label { fill: #f3c96b; }
    </style>
  </defs>

  <rect width="1080" height="680" fill="#0b1020"/>

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="50" y="70" class="figure-title">只接受严格变好</text>
    <text x="50" y="108" class="figure-subtitle">同一组检测器复检；持平或变差，立即回滚。</text>
    <text x="1030" y="70" class="corner-note" text-anchor="end">默认 4 轮 · 可配 1–8</text>

    <path d="M230 268H284" fill="none" stroke="#6f9dff" stroke-width="2.6" marker-end="url(#arrow)"/>
    <path d="M465 268H519" fill="none" stroke="#6f9dff" stroke-width="2.6" marker-end="url(#arrow)"/>
    <path d="M700 268H759" fill="none" stroke="#6f9dff" stroke-width="2.6" marker-end="url(#arrow)"/>

    <path d="M823 319V390H610V453" fill="none" stroke="#6f9dff" stroke-width="2.6" marker-end="url(#arrow)"/>
    <text x="705" y="382" class="branch-label" text-anchor="middle">严格更好</text>

    <path d="M907 319V390H895V453" fill="none" stroke="#f3c96b" stroke-width="2.6" marker-end="url(#arrow-gold)"/>
    <text x="948" y="382" class="branch-label gold-label" text-anchor="middle">否则</text>

    <path d="M610 566V620H140V327" fill="none" stroke="#6f9dff" stroke-width="2.6" marker-end="url(#arrow)"/>
    <text x="372" y="647" class="branch-label" text-anchor="middle">继续下一轮</text>

    <g>
      <rect x="50" y="210" width="180" height="116" rx="20" fill="#6f9dff" fill-opacity=".07" stroke="#6f9dff" stroke-opacity=".68" stroke-width="2"/>
      <text x="140" y="258" class="node-title" text-anchor="middle">检测</text>
      <text x="140" y="293" class="node-subtitle" text-anchor="middle">重跑全部检测器</text>
    </g>

    <g>
      <rect x="285" y="210" width="180" height="116" rx="20" fill="#6f9dff" fill-opacity=".07" stroke="#6f9dff" stroke-opacity=".68" stroke-width="2"/>
      <text x="375" y="258" class="node-title" text-anchor="middle">缺陷清单</text>
      <text x="375" y="293" class="node-subtitle" text-anchor="middle">结构化问题列表</text>
    </g>

    <g>
      <rect x="520" y="210" width="180" height="116" rx="20" fill="#6f9dff" fill-opacity=".07" stroke="#6f9dff" stroke-opacity=".68" stroke-width="2"/>
      <text x="610" y="258" class="node-title" text-anchor="middle">有界修复</text>
      <text x="610" y="293" class="node-subtitle" text-anchor="middle">仅执行登记动作</text>
    </g>

    <g>
      <path d="M851 204Q865 194 879 204L956 258Q970 268 956 278L879 332Q865 342 851 332L774 278Q760 268 774 258Z" fill="#f3c96b" fill-opacity=".08" stroke="#f3c96b" stroke-width="2"/>
      <text x="865" y="258" class="node-title" text-anchor="middle">分数比较</text>
      <text x="865" y="293" class="node-subtitle" text-anchor="middle">错误数，问题总数</text>
    </g>

    <g>
      <rect x="520" y="454" width="180" height="112" rx="20" fill="#6f9dff" fill-opacity=".1" stroke="#6f9dff" stroke-width="2"/>
      <text x="610" y="501" class="node-title" text-anchor="middle">接受</text>
      <text x="610" y="536" class="node-subtitle" text-anchor="middle">继续下一轮复检</text>
    </g>

    <g>
      <rect x="790" y="454" width="210" height="112" rx="20" fill="#f3c96b" fill-opacity=".08" stroke="#f3c96b" stroke-opacity=".82" stroke-width="2"/>
      <text x="895" y="501" class="node-title" text-anchor="middle">回滚快照</text>
      <text x="895" y="536" class="node-subtitle" text-anchor="middle">停止无进展循环</text>
    </g>
  </g>
</svg>
