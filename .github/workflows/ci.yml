name: CI

on:
  push:
    branches: [main, "opensource/**"]
  pull_request:

env:
  UV_PYTHON: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check app pdf_zh_translator tests scripts

      - name: Terminology corpus lint
        run: uv run python -m pdf_zh_translator corpus-lint --strict

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      # dry-run 排版需要一款 CJK 字体做子集化回退
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Smoke test
        run: PYTHON=.venv/bin/python bash scripts/smoke_test.sh
