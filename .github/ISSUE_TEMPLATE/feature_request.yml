name: 功能建议
description: 新功能、新翻译后端、体验改进等
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述现在的痛点或缺口，而不是直接给实现方案
      placeholder: "翻译 50 篇论文时只能一篇篇手动提交……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 你希望它长什么样（命令行参数、界面交互、输出格式等）
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 翻译引擎（pdf_zh_translator）
        - Web 界面 / API（app）
        - Agent Skill（skills/paper-translate）
        - QA / 基准评测
        - 部署 / 运维
        - 文档

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑过的替代方案
      description: 现在如何绕过？为什么不够好？
